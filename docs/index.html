<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>💼 JobVision Market Analysis</title>
<link rel="stylesheet" href="style.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>

<header class="page-header">
  <h1>💼 JobVision Job Market Overview</h1>
  <p class="subtitle">نمای کلی بازار کار ایران بر اساس آگهی‌های JobVision</p>
  <p class="updated-at" id="updatedAt"></p>
</header>

<form class="search-bar" id="search-form">
  <input
    id="search-input"
    type="text"
    placeholder="عنوان شغلی یا شرکت... مثلاً Python Developer"
  />

  <div class="search-filters">
    <div class="filter-group">
      <label for="search-city-filter">
        📍 شهر
      </label>

      <select id="search-city-filter">
        <option value="">همه شهرها</option>
      </select>
    </div>

    <div class="filter-group">
      <label for="search-category-filter">
        💼 دسته‌بندی شغلی
      </label>

      <select id="search-category-filter">
        <option value="">همه دسته‌بندی‌ها</option>
      </select>
    </div>
  </div>

  <div class="search-actions">
    <button id="searchBtn" type="submit">
      🔍 جستجو
    </button>

    <button
      id="backBtn"
      type="button"
      class="hidden"
    >
      ← بازگشت به نمای کلی
    </button>
  </div>
</form>

<main id="app">

  <p id="loading">در حال بارگذاری داده‌ها...</p>

  <section id="overview-section" class="hidden">

    <div class="metrics" id="metrics"></div>

    <div class="section-title">🔥 آخرین آگهی‌های شغلی</div>
    <div class="carousel" id="job-carousel"></div>

    <div class="section-title">📊 نمودارهای بازار کار</div>
    <div class="charts-grid">
      <div class="chart-box">
        <h3>🏢 برترین شرکت‌ها</h3>
        <canvas id="company-chart"></canvas>
      </div>
      <div class="chart-box">
        <h3>📍 آگهی‌ها به تفکیک شهر/استان</h3>
        <canvas id="location-chart"></canvas>
      </div>
      <div class="chart-box">
        <h3>🎯 سطح شغلی</h3>
        <canvas id="seniority-chart"></canvas>
      </div>
      <div class="chart-box">
        <h3>📋 نوع همکاری</h3>
        <canvas id="work-type-chart"></canvas>
      </div>
    </div>

  </section>

  <section id="search-section" class="hidden">
    <div id="search-results"></div>

    <div class="section-title">📚 مهارت‌های موردنیاز</div>

    <div id="skills-analysis">
      <div class="skills-empty">
        برای مشاهده تحلیل مهارت، یک جستجو انجام دهید.
      </div>
    </div>

    <div id="search-positions"></div>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
